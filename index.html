<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Local</title>
    
    <!-- CONEXÃO COM O MANIFESTO DO PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#27ae60">
    
    <!-- 🎨 ESTILIZAÇÃO (CSS) -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .radio-opcoes {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

    <!-- 🧱 INTERFACE (HTML) -->
    <div class="box">
        <h2>Formulário Local</h2>
        <form id="meuFormulario">
            
            <div class="campo">
                <label for="pergunta1">1. Qual tecnologia você quer aprender agora?</label>
                <input type="text" id="pergunta1" placeholder="Ex: React, Node, Python..." required>
            </div>

            <div class="campo">
                <label for="pergunta2">2. Quantas horas por semana pretende estudar?</label>
                <select id="pergunta2" required>
                    <option value="">Selecione uma opção...</option>
                    <option value="1 a 5 horas">1 a 5 horas</option>
                    <option value="6 a 10 horas">6 a 10 horas</option>
                    <option value="Mais de 10 horas">Mais de 10 horas</option>
                </select>
            </div>

            <div class="campo">
                <label>3. Tem preferência por estudar ouvindo música?</label>
                <div class="radio-opcoes">
                    <label><input type="radio" name="pergunta3" value="Sim" required> Sim</label>
                    <label><input type="radio" name="pergunta3" value="Não"> Não</label>
                </div>
            </div>

            <button type="submit">Gravar Resposta</button>
        </form>
    </div>

    <!-- ⚙️ LÓGICA DE SALVAMENTO (JAVASCRIPT) -->
    <script>
        // Mensagem de teste instantânea para confirmar a abertura
        alert("O arquivo carregou o JavaScript corretamente!");

        document.getElementById('meuFormulario').addEventListener('submit', function(evento) {
            evento.preventDefault(); // Impede a página de recarregar e quebrar a rota

            // Coleta os valores digitados/selecionados
            const valor1 = document.getElementById('pergunta1').value;
            const valor2 = document.getElementById('pergunta2').value;
            const valor3 = document.querySelector('input[name="pergunta3"]:checked').value;

            // Transforma as respostas em um bloco estruturado de informações
            const dadosObjeto = {
                tecnologia: valor1,
                tempoEstudo: valor2,
                musica: valor3,
                dataEnvio: new Date().toLocaleString('pt-BR')
            };

            // Puxa o banco local do navegador. Se não houver nada criado, inicia uma lista do zero
            let historico = JSON.parse(localStorage.getItem('banco_quiz_local')) || [];
            
            // Coloca a nova resposta no histórico
            historico.push(dadosObjeto);
            
            // Grava a lista atualizada de volta na memória física do navegador
            localStorage.setItem('banco_quiz_local', JSON.stringify(historico));

            // Mostra o aviso na tela e limpa os campos do formulário
            alert("Sucesso! Seus dados foram salvos no armazenamento local do navegador.");
            document.getElementById('meuFormulario').reset();
            
            // Mostra os dados no console de diagnóstico para checagem rápida
            console.log("Banco de dados atualizado:", historico);
        });
    </script>
</body>
</html>
